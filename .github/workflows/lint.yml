---
name: Check for lint errors

on:
  pull_request:
    branches: [ main ]

permissions: {} # lock everything by default (least-privilege)

jobs:
  lint:
    name: Lint code and Markdown
    runs-on:
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'gha-runner-scale-set-ubuntu-24-amd64-small' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint code
        uses: Consensys-Incorporated/github-actions/docs-lint-all@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0

      - name: Check Markdown formatting
        run: npm run format:docs:check
