name: Weekly check

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Run link check
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only; Renovate leaves this pinned (renovate.json)
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LinkCheck
        uses: Consensys-Incorporated/github-actions/docs-link-check@b1b859363ac0a54a542a45dfb379d8b48e34a081 # 2.1.1
        with:
          CONFIG_FILE: .linkspector.yml

  slackNotification:
    needs: linkCheck
    if: ${{ failure() }}
    runs-on: gha-runner-scale-set-ubuntu-24-amd64-small
    permissions: {}
    steps:
      - name: Slack Notification
        uses: Consensys-Incorporated/github-actions/slack-notify@10825e5427095aae0ca5686db2caa5029d693a4f # 2.0.1
        with:
          SLACK_CHANNEL: ci-documentation
          SLACK_COLOR: danger
          SLACK_TITLE: Linea docs weekly link check - Failure
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG_MINIMAL: true
