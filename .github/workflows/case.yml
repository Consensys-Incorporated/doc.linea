---
name: Check file name case

on:
  pull_request:
    branches: [ main ]
    paths: ['docs/**']

permissions: {} # lock everything by default (least-privilege)

jobs:
  case:
    name: Check for case being inconsistent
    runs-on:
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'gha-runner-scale-set-ubuntu-24-amd64-small' }}
    strategy:
      matrix:
        folder: ["docs"]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Case check action
        uses: Consensys-Incorporated/github-actions/docs-case-check@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
        with:
          DOC_DIR: ${{ matrix.folder }}
