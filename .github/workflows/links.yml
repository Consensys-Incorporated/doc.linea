name: Check for broken links

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Link Checking
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LinkCheck
        uses: Consensys-Incorporated/github-actions/docs-link-check@05bc3d85c6b139c6afc18516fb22e53d4efaecaf # main
        with:
          CONFIG_FILE: .linkspector.yml
          CHANGED_FILES_ONLY: true
