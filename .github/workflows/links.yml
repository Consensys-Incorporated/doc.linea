name: Check for broken links

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Link Checking
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Limit the check to the pull request diff
        id: diff
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.md' '*.mdx' > "$RUNNER_TEMP/changed-docs.txt"
          if python3 - "$RUNNER_TEMP/changed-docs.txt" << 'PY'
          import pathlib
          import sys

          changed = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          source = pathlib.Path(".linkspector.yml").read_text().splitlines()

          def section(name):
              values = []
              index = 0
              while index < len(source):
                  if source[index].startswith(name + ":"):
                      index += 1
                      while index < len(source) and source[index].startswith((" ", "\t")):
                          item = source[index].strip()
                          if item.startswith("- "):
                              values.append(item[2:].strip().strip("'\""))
                          index += 1
                      break
                  index += 1
              return values

          def norm(path):
              path = path.replace("\\", "/").strip()
              while path.startswith("./"):
                  path = path[2:]
              return path.rstrip("/")

          def under(path, root):
              return path == root or path.startswith(root + "/")

          roots = [norm(path) for path in section("dirs") if norm(path)]
          if not roots:
              sys.exit("The linkspector config has no dirs, so the pull request check has no scope.")
          excluded = [norm(path) for path in section("excludedDirs") if norm(path)]

          def included(path):
              path = norm(path)
              if not any(under(path, root) for root in roots):
                  return False
              return not any(under(path, root) for root in excluded)

          changed = [path for path in changed if included(path)]
          if not changed:
              sys.exit(2)

          kept = []
          index = 0
          while index < len(source):
              line = source[index]
              if line.startswith("dirs:"):
                  index += 1
                  while index < len(source) and source[index].startswith((" ", "\t")):
                      index += 1
                  continue
              kept.append(line)
              index += 1

          def quote(path):
              return '"' + path.replace("\\", "\\\\").replace('"', '\\"') + '"'

          files = ["files:"] + [f"  - {quote(path)}" for path in changed]
          pathlib.Path(".linkspector-pr.yml").write_text("\n".join(files + kept) + "\n")
          PY
          then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi

      - name: LinkCheck
        if: steps.diff.outputs.skip != 'true'
        uses: Consensys-Incorporated/github-actions/docs-link-check@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
        with:
          CONFIG_FILE: .linkspector-pr.yml
