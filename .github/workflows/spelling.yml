---
name: Check for spelling with vale

on:
  pull_request:
    branches: [ main ]

permissions: {} # lock everything by default (least-privilege)

jobs:
  vale:
    name: Spelling
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'gha-runner-scale-set-ubuntu-24-amd64-small' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vale
        uses: Consensys-Incorporated/github-actions/docs-spelling-check@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
