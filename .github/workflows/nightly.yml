name: Nightly check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Run link check
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LinkCheck
        uses: Consensys-Incorporated/github-actions/docs-link-check@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
        with:
          CONFIG_FILE: .linkspector.yml

  slackNotification:
    needs: linkCheck
    if: ${{ failure() }}
    runs-on: gha-runner-scale-set-ubuntu-24-amd64-small
    permissions: {}
    steps:
      - name: Slack Notification
        uses: Consensys-Incorporated/github-actions/slack-notify@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
        with:
          SLACK_CHANNEL: ci-documentation
          SLACK_COLOR: danger
          SLACK_TITLE: Linea docs nightly link check - Failure
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG_MINIMAL: true
