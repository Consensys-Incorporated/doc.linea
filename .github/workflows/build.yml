---
name: Build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Cancel older runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {} # lock everything by default (least-privilege)

jobs:
  build:
    name: Build
    runs-on:
      ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'gha-runner-scale-set-ubuntu-24-amd64-med' }}
    permissions:
      contents: read  # least-privilege for this job only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # The shared action reuses this Node.js toolcache install, so it runs npm 12.
      - name: Install npm
        run: npm install -g npm@12.2.1

      - name: Build docs
        uses: Consensys-Incorporated/github-actions/docs-build@89c262a30cae735be99dc776f9556b796fb456ca # 1.0.0
