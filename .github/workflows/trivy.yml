---
name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {} # lock everything by default (least-privilege)

jobs:
  trivy:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Consensys-Incorporated/github-actions/.github/workflows/trivy.yml@10825e5427095aae0ca5686db2caa5029d693a4f # 2.0.1
    with:
      environment: security # holds SLACK_WEBHOOK
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }} # value from the security environment
