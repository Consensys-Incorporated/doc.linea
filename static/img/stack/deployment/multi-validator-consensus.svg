<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 500"
  width="100%"
  height="auto"
  role="img"
  aria-labelledby="mvc-title mvc-desc"
>
  <title id="mvc-title">Multi-validator Maru deployment on Lineth</title>
  <desc id="mvc-desc">
    Four Maru validators run QBFT consensus in an all-to-all mesh. Each validator
    pairs one-to-one with its own Linea Besu execution client over the Engine
    API, and those execution clients stay in sync with each other over peer-to-peer
    chain sync. A single designated Linea Besu feeds the unchanged downstream
    Lineth components: coordinator, prover, state manager, RPC nodes, L1 contracts,
    and bridge.
  </desc>

  <defs>
    <marker id="mvc-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--linea-mermaid-cyan-stroke)" />
    </marker>
    <marker id="mvc-arrow-core" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--linea-mermaid-core-stroke)" />
    </marker>
    <marker id="mvc-arrow-muted" viewBox="0 0 10 10" refX="10" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--linea-text-muted)" />
    </marker>
  </defs>

  <!-- PP Band 1: Consensus (Maru) PP -->

  <circle cx="30" cy="100" r="12"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="30" y="105" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    font-weight="600" fill="var(--linea-text-primary)">1</text>
  <text x="50" y="95" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">Consensus layer</text>
  <text x="50" y="113" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">(Maru)</text>

  <!-- QBFT mesh: non-adjacent pairs as arcs above the boxes -->
  <path d="M 299 83 Q 692 8 1085 83" fill="none" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />
  <path d="M 299 83 Q 561 22 823 83" fill="none" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />
  <path d="M 561 83 Q 823 22 1085 83" fill="none" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />

  <!-- QBFT mesh: adjacent pairs -->
  <line x1="390" y1="111" x2="470" y2="111" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />
  <line x1="652" y1="111" x2="732" y2="111" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />
  <line x1="914" y1="111" x2="994" y2="111" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />

  <!-- Maru validator boxes -->
  <rect x="200" y="84" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-cyan-bg)" stroke="var(--linea-mermaid-cyan-stroke)" stroke-width="1.5" />
  <text x="299" y="105" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Maru</text>
  <text x="299" y="124" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">validator 0</text>

  <rect x="462" y="84" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-cyan-bg)" stroke="var(--linea-mermaid-cyan-stroke)" stroke-width="1.5" />
  <text x="561" y="105" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Maru</text>
  <text x="561" y="124" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">validator 1</text>

  <rect x="724" y="84" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-cyan-bg)" stroke="var(--linea-mermaid-cyan-stroke)" stroke-width="1.5" />
  <text x="823" y="105" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Maru</text>
  <text x="823" y="124" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">validator 2</text>

  <rect x="986" y="84" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-cyan-bg)" stroke="var(--linea-mermaid-cyan-stroke)" stroke-width="1.5" />
  <text x="1085" y="105" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Maru</text>
  <text x="1085" y="124" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">validator 3</text>

  <line x1="16" y1="172" x2="1184" y2="172" stroke="var(--linea-mermaid-cluster-border)"
    stroke-width="1" stroke-dasharray="6 5" />

  <!-- PP Band 2: Execution (Linea Besu) PP -->

  <circle cx="30" cy="226" r="12"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="30" y="231" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    font-weight="600" fill="var(--linea-text-primary)">2</text>
  <text x="50" y="221" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">Execution layer</text>
  <text x="50" y="239" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">(Linea Besu)</text>

  <!-- Engine API links -->
  <line x1="299" y1="140" x2="299" y2="207" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="307" y="192" font-family="AtypText, sans-serif" font-size="11"
    fill="var(--linea-text-muted)">Engine API</text>
  <line x1="561" y1="140" x2="561" y2="207" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="569" y="192" font-family="AtypText, sans-serif" font-size="11"
    fill="var(--linea-text-muted)">Engine API</text>
  <line x1="823" y1="140" x2="823" y2="207" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="831" y="192" font-family="AtypText, sans-serif" font-size="11"
    fill="var(--linea-text-muted)">Engine API</text>
  <line x1="1085" y1="140" x2="1085" y2="207" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="1093" y="192" font-family="AtypText, sans-serif" font-size="11"
    fill="var(--linea-text-muted)">Engine API</text>

  <!-- Linea Besu execution clients -->
  <rect x="200" y="210" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="299" y="231" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Linea Besu</text>
  <text x="299" y="250" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">0</text>

  <rect x="462" y="210" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="561" y="231" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Linea Besu</text>
  <text x="561" y="250" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">1</text>

  <rect x="724" y="210" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="823" y="231" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Linea Besu</text>
  <text x="823" y="250" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">2</text>

  <rect x="986" y="210" width="198" height="54" rx="4"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="1085" y="231" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">Linea Besu</text>
  <text x="1085" y="250" text-anchor="middle" font-family="AtypText, sans-serif" font-size="13"
    fill="var(--linea-text-primary)">3</text>

  <!-- Peer-to-peer chain sync -->
  <line x1="398" y1="237" x2="462" y2="237" stroke="var(--linea-text-muted)" stroke-width="1.5"
    stroke-dasharray="5 4" marker-start="url(#mvc-arrow-muted)" marker-end="url(#mvc-arrow-muted)" />
  <line x1="660" y1="237" x2="724" y2="237" stroke="var(--linea-text-muted)" stroke-width="1.5"
    stroke-dasharray="5 4" marker-start="url(#mvc-arrow-muted)" marker-end="url(#mvc-arrow-muted)" />
  <line x1="922" y1="237" x2="986" y2="237" stroke="var(--linea-text-muted)" stroke-width="1.5"
    stroke-dasharray="5 4" marker-start="url(#mvc-arrow-muted)" marker-end="url(#mvc-arrow-muted)" />

  <!-- Designated node feeds the downstream stack -->
  <line x1="299" y1="266" x2="299" y2="347" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="307" y="306" font-family="AtypText, sans-serif" font-size="11"
    fill="var(--linea-text-muted)">Designated node</text>

  <line x1="16" y1="320" x2="1184" y2="320" stroke="var(--linea-mermaid-cluster-border)"
    stroke-width="1" stroke-dasharray="6 5" />

  <!-- PP Band 3: Downstream Lineth (unchanged) PP -->

  <circle cx="30" cy="366" r="12"
    fill="var(--linea-mermaid-core-bg)" stroke="var(--linea-mermaid-core-stroke)" stroke-width="1.5" />
  <text x="30" y="371" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    font-weight="600" fill="var(--linea-text-primary)">3</text>
  <text x="50" y="356" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">Downstream</text>
  <text x="50" y="373" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">Lineth</text>
  <text x="50" y="390" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">(unchanged)</text>

  <rect x="200" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="272" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">Coordinator</text>

  <rect x="368" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="440" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">Prover</text>

  <rect x="536" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="608" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">State manager</text>

  <rect x="704" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="776" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">RPC nodes</text>

  <rect x="872" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="944" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">L1 contracts</text>

  <rect x="1040" y="350" width="144" height="48" rx="4" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1112" y="379" text-anchor="middle" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-primary)">Bridge</text>

  <!-- PP Legend PP -->

  <rect x="16" y="420" width="1168" height="60" rx="6" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1" />
  <text x="36" y="455" font-family="AtypText, sans-serif" font-size="13" font-weight="600"
    fill="var(--linea-text-primary)">Legend:</text>

  <line x1="120" y1="450" x2="160" y2="450" stroke="var(--linea-mermaid-cyan-stroke)"
    stroke-width="1.5" marker-start="url(#mvc-arrow-cyan)" marker-end="url(#mvc-arrow-cyan)" />
  <text x="170" y="455" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-secondary)">QBFT consensus (3 phases)</text>

  <line x1="395" y1="450" x2="435" y2="450" stroke="var(--linea-mermaid-core-stroke)"
    stroke-width="1.5" marker-end="url(#mvc-arrow-core)" />
  <text x="445" y="455" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-secondary)">Engine API</text>

  <line x1="560" y1="450" x2="600" y2="450" stroke="var(--linea-text-muted)" stroke-width="1.5"
    stroke-dasharray="5 4" marker-start="url(#mvc-arrow-muted)" marker-end="url(#mvc-arrow-muted)" />
  <text x="610" y="455" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-secondary)">Linea Besu P2P (chain sync)</text>

  <rect x="850" y="440" width="40" height="20" rx="3" fill="transparent"
    stroke="var(--linea-mermaid-cluster-border)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="900" y="455" font-family="AtypText, sans-serif" font-size="12"
    fill="var(--linea-text-secondary)">Unchanged Lineth components</text>
</svg>
